<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anchik.net Error 404 - Page not found!</title>
    <link type="text/css" rel="stylesheet" href="404style.css"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="apple-touch-icon" href="images/apple_favicon.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<body>
<div class="full">
<div id="notfound">
    <div class="notfound">
        <div class="notfound-404 mb-4">
            <h1>Oops!</h1>
        </div>
        <h2><b>404 - Page not found!</b></h2>
        <p>The page you are looking for might have been removed had its name changed or is temporarily unavailable.</p>
        <a role="button" class="btn btn-danger crystal_rose btn-lg btn-shake mt-4"
           href="https://anchik.net/">Back to
            Anchik.net</a>
    </div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
<script type="text/javascript">
    $(document).ready(function(e){
        var left = 0,
            top = 0,
            element = $('body'),
            offset =  { left: element.offset().left, top: element.offset().top };
        $(this).bind('mousemove', function(e){
            left = (e.pageX-offset.left);
            top = (e.pageY-offset.top);
            $('h1').css({
                backgroundPosition: '-'+(0.15*left)+'px -'+(0.15*top)+'px'
            });
        });
    });
</script>
</body>
</html>
